name: Stash source probe
on:
  push:
    branches: [probe/stash-source-20261015]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Dry-run Stash wishlist migration
        run: |
          python - <<'PY'
          import urllib.request, json
          url='https://rateapp-delta.vercel.app/api/internal/stash-want-import-20261015?dry_run=true'
          req=urllib.request.Request(url, data=b'{}', method='POST',
              headers={'Accept':'application/json','Content-Type':'application/json','User-Agent':'RateApp-Audit/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=110) as response:
                  data=json.load(response)
                  print('STATUS',response.status)
                  print('DATA',json.dumps(data,ensure_ascii=False))
          except Exception as exc:
              print('ERROR',repr(exc))
              if hasattr(exc,'read'): print('BODY',exc.read().decode('utf-8','replace')[:5000])
              raise
          PY