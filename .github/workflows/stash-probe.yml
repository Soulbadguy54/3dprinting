name: Stash source probe
on:
  push:
    branches: [probe/stash-source-20261015]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Stash pagination and exact titles
        run: |
          python -m pip -q install beautifulsoup4
          python - <<'PY'
          import urllib.request, re, json
          from bs4 import BeautifulSoup
          for cat in ['archived','want']:
              url=f'https://stash.games/users/Soulbadguy/games/{cat}/'
              for suffix in (['','?page=2','?page=3'] if cat=='want' else ['']):
                  req=urllib.request.Request(url+suffix, headers={'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'})
                  try:
                      data=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
                      soup=BeautifulSoup(data,'html.parser')
                      for t in soup(['script','style','svg','noscript']):t.decompose()
                      print('PAGE',cat,suffix or '1','LEN',len(data))
                      print('PAGINATION',json.dumps([(a.get_text(' ',strip=True),a.get('href')) for a in soup.find_all('a') if ('page=' in (a.get('href') or '') or a.get_text(' ',strip=True) in ('1','2','3','Next'))],ensure_ascii=False)[:5000])
                      cards=[]
                      for a in soup.find_all('a',href=True):
                          href=a['href'];txt=a.get_text(' ',strip=True)
                          if '/games/' in href and txt and len(txt)<120:
                              cards.append([txt,href,a.get('class')])
                      print('GAME_LINKS',json.dumps(cards,ensure_ascii=False)[:20000])
                      print('HAS BIOSHOCK', 'BioShock Infinite' in data)
                      x=data.find('BioShock Infinite')
                      if x>=0:print('BIO_HTML',data[x-1100:x+1400])
                  except Exception as e:print('ERROR',repr(e))
          PY