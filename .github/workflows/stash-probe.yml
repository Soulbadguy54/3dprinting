name: Stash source probe
on:
  push:
    branches: [probe/stash-source-20261015]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect identifiers on Stash game pages
        run: |
          python -m pip -q install beautifulsoup4
          python - <<'PY'
          from bs4 import BeautifulSoup
          import urllib.request,re,json
          for slug in ['bioshock-infinite','shadow-of-the-colossus--1','dispatch--3','halo-campaign-evolved','beast-of-reincarnation']:
              u='https://stash.games/games/'+slug
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'})
              try:
                  html=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
                  soup=BeautifulSoup(html,'html.parser')
                  print('GAME',slug,'LEN',len(html),'TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
                  for a in soup.find_all('a',href=True):
                      if 'igdb' in a['href'] or 'rawg' in a['href'] or 'steam' in a['href']:
                          print('LINK',a['href'],a.get_text(' ',strip=True)[:90])
                  for m in re.finditer(r'(?i)igdb.?id|data-game-id|game_id|gameId|igdb.com',html):
                      print('META',html[max(0,m.start()-100):m.end()+220].replace('\n',' ')[:450])
                      if m.start()>130000:break
              except Exception as e:print('ERROR',slug,repr(e))
          PY