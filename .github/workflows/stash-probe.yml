name: Stash source probe
on:
  push:
    branches: [probe/stash-source-20261015]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract wishlist source cover references
        run: |
          python -m pip -q install beautifulsoup4
          python - <<'PY'
          from bs4 import BeautifulSoup
          import urllib.request,json,re
          games=[]
          for pg in ['','?page=2']:
              url='https://stash.games/users/Soulbadguy/games/want/'+pg
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              soup=BeautifulSoup(urllib.request.urlopen(req,timeout=25).read(),'html.parser')
              for a in soup.select('a.games-list__item-link[href^="/games/"]'):
                  h=a.get('href'); title=a.get_text(' ',strip=True)
                  image=a.find('img')
                  img=(image.get('data-src') or image.get('src') or '') if image else ''
                  match=re.search(r'/(co[^/.]+)\.(?:webp|png|jpg)',img)
                  print('ITEM',json.dumps({'text':title,'slug':h.split('/games/',1)[-1],'image':match.group(1) if match else None,'src':img[:120]},ensure_ascii=False))
                  games.append(h)
          print('TOTAL',len(games),'UNIQUE',len(set(games)))
          PY