name: Stash source probe
on:
  push:
    branches: [probe/stash-source-20261015]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public stash lists
        shell: python
        run: |
          import urllib.request, urllib.error, re, json, html
          from html.parser import HTMLParser
          class Titles(HTMLParser):
              def __init__(self):
                  super().__init__();self.txt=[]
              def handle_data(self,data):
                  t=data.strip()
                  if t: self.txt.append(t)
          for category in ['archived','want']:
              url=f'https://stash.games/users/Soulbadguy/games/{category}/'
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data=response.read().decode('utf-8','replace')
                      print('===',category,'STATUS',response.status,'BYTES',len(data),'FINAL',response.url)
                      print('HEAD:',data[:5000])
                      print('NEXT_DATA',bool(re.search(r'__NEXT_DATA__|__NUXT__|__INITIAL_STATE__|game-card|game-list',data,re.I)))
                      parser=Titles();parser.feed(data)
                      print('TEXT:', '\\n'.join(parser.txt[:200]))
              except Exception as e:
                  print('===',category,'ERROR',repr(e))
