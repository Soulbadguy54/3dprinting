name: RateApp genre seed
on:
  push:
    branches: [probe/stash-source-20261015]
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh IGDB genres in RateApp production
        run: |
          python - <<'PY'
          import urllib.request,json
          url='https://rateapp-delta.vercel.app/api/internal/seed-genres-20261015'
          req=urllib.request.Request(url,data=b'{}',method='POST',headers={
              'Content-Type':'application/json',
              'User-Agent':'RateApp-Genre-Migration/1.0',
          })
          try:
              with urllib.request.urlopen(req,timeout=105) as r:
                  payload=json.load(r)
                  print('STATUS',r.status)
                  print('GENRES',json.dumps(payload))
                  assert r.status==200 and payload.get('synced',0)>0
          except Exception as exc:
              print('ERROR',repr(exc))
              if hasattr(exc,'read'):print('BODY',exc.read().decode('utf-8','replace')[:5000])
              raise
          PY