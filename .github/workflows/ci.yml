name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Python API syntax
        run: python -m compileall -q api

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rateapp_test
          POSTGRES_USER: rateapp_test
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rateapp_test -d rateapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rateapp_test:testpass@localhost:5432/rateapp_test
      VERCEL_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
      - name: Apply versioned PostgreSQL migrations
        run: python -m alembic upgrade head
      - name: Integration tests against PostgreSQL
        run: python -m unittest discover -s tests -v
