name: Inspect Stash collections Oct 15
on:
  push:
    branches: [probe/stash-source-20261015]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Dry-run exact IGDB collection game ID resolution
        run: |
          python - <<'PY'
          import urllib.request,json
          url='https://rateapp-soulbadguy.vercel.app/api/internal/stash-collections-20261015?dryRun=true'
          req=urllib.request.Request(url,data=b'',method='POST',headers={
              'User-Agent':'RateApp-Migration-Probe/1.0',
              'Content-Type':'application/json',
          })
          try:
              with urllib.request.urlopen(req,timeout=115) as r:
                  data=json.load(r)
                  print('STATUS',r.status)
                  print('SUMMARY',json.dumps({k:v for k,v in data.items() if k!='mappings'},ensure_ascii=False))
                  print('MAPPINGS',json.dumps(data.get('mappings'),ensure_ascii=False))
                  assert r.status==200
                  assert data['ready']
                  assert data['expectedMemberships']==44
                  assert data['resolved']==44
                  assert data['uniqueCovers']==41
          except Exception as exc:
              print('ERROR',repr(exc))
              if hasattr(exc,'read'):print('BODY',exc.read().decode('utf-8','replace')[:7000])
              raise
          PY