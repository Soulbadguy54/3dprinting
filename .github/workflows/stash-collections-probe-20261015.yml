name: Inspect Stash collections Oct 15
on:
  push:
    branches: [probe/stash-source-20261015]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Stash collection HTML payload
        run: |
          python -m pip install -q beautifulsoup4 requests
          python - <<'PY'
          import requests,json
          from bs4 import BeautifulSoup
          url='https://stash.games/users/Soulbadguy/collections/dfhpn'
          html=requests.get(url,timeout=30,headers={'User-Agent':'Mozilla/5.0'}).text
          s=BeautifulSoup(html,'html.parser')
          print('BODY_TEXT',s.get_text(' ',strip=True)[-9000:])
          print('BODY_HTML',str(s.body)[-20000:])
          print('SCRIPTS',json.dumps([{'src':x.get('src'),'type':x.get('type'),'body':x.get_text()[:600]} for x in s.find_all('script')],ensure_ascii=False))
          print('IMAGES',json.dumps([{'src':x.get('src'),'data-src':x.get('data-src'),'alt':x.get('alt')} for x in s.find_all('img')],ensure_ascii=False))
          PY