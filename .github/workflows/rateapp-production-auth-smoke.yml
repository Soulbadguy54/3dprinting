name: RateApp production auth smoke
on:
  push:
    branches: [probe/stash-source-20261015]
jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check live API startup and auth errors
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          host="https://rateapp-delta.vercel.app"
          checks=[
            ("GET","/api/bootstrap",None),
            ("GET","/api/auth/me",None),
            ("POST","/api/auth/login",b'{"identifier":"smoke_no_user_359531","pin":"12345678"}'),
          ]
          for method,path,body in checks:
            req=urllib.request.Request(host+path,data=body,method=method,
              headers={"Content-Type":"application/json","User-Agent":"RateApp-Production-Auth-Smoke/1.0"})
            try:
              with urllib.request.urlopen(req,timeout=45) as r:
                code=r.status
                txt=r.read(600).decode("utf-8","replace")
            except urllib.error.HTTPError as e:
              code=e.code
              txt=e.read(600).decode("utf-8","replace")
            print("SMOKE",method,path,"status",code,txt[:200])
            assert code in (400,401,403,404,422,429), (method,path,code,txt)
          PY